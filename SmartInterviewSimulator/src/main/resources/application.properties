spring.application.name=SmartInterviewSimulator
# ===============================
# SERVER CONFIG
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIG (MySQL)

# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/interview_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root2003

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT CONFIG
# ===============================

jwt.expiration=3600000



groq.api.key=${GROQ_API_KEY:YOUR_GROQ_API_KEY}
groq.url=https://api.groq.com/openai/v1/chat/completions

# ===============================
# OPENAI CONFIG
# ===============================
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
# ===============================
# LOGGING (OPTIONAL)
# ===============================
logging.level.org.springframework=INFO
logging.level.com.interview.simulator=DEBUG
